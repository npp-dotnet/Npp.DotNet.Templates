name: Package Templates
on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    permissions:
      id-token: write   # required by NuGet/login
    concurrency:
      group: rel-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: >
            10.0.x

      - name: Build package
        run: |
          $env:PackageReleaseNotes=$($(& git log --pretty="format:%b" -1) -join "`r`n")
          dotnet restore
          dotnet build -c Release
          dotnet pack

      - name: Obtain NuGet API key
        uses: NuGet/login@d22cc5f58ff5b88bf9bd452535b4335137e24544 # v1.1.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish release
        working-directory: ./bin/Release
        run: |
          dotnet nuget push `
            Npp.DotNet.Templates.${env:RELEASE}.nupkg `
            -k ${env:API_KEY} `
            -s https://api.nuget.org/v3/index.json `
            --skip-duplicate
        env:
          RELEASE: ${{ github.ref_name }}
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
