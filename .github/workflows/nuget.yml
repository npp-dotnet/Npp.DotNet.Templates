name: Package Templates
on:
  push:
    tags:
      - '**'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    permissions:
      id-token: write   # required by NuGet/login
    concurrency:
      group: rel-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: >
            10.0.x

      - name: Build package
        run: |
          $env:PackageReleaseNotes=$($(& git log --pretty="format:%b" -1) -join "`r`n")
          dotnet restore
          dotnet build -c Release
          dotnet pack

      - name: Obtain NuGet API key
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish release
        working-directory: ./bin/Release
        run: |
          dotnet nuget push `
            Npp.DotNet.Templates.${env:RELEASE}.nupkg `
            -k ${env:API_KEY} `
            -s https://api.nuget.org/v3/index.json `
            --skip-duplicate
        env:
          RELEASE: ${{ github.ref_name }}
          API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
